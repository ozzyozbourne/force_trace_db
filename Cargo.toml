[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
forge-model   = { path = "crates/forge-model" }
forge-meta    = { path = "crates/forge-meta" }
forge-storage = { path = "crates/forge-storage" }
forge-index   = { path = "crates/forge-index" }
forge-ingest  = { path = "crates/forge-ingest" }
forge-query   = { path = "crates/forge-query" }
forge-server  = { path = "crates/forge-server" }

# ---- pinned core (master plan; do not change) ----
datafusion          = "=55.2.0"   # first used in M2
vortex              = { version = "=0.89.0", features = ["tokio", "object_store"] }   # defaults keep zstd
vortex-datafusion   = "=0.89.0"   # first used in M2
arrow               = "59.2"                                                          # resolves 59.3.x
object_store        = { version = "0.13.2", features = ["fs", "aws", "gcp", "azure"] }
tonic               = { version = "0.14.6", features = ["gzip", "zstd"] }
prost               = "0.14.4"
opentelemetry-proto = { version = "0.33.1", features = ["gen-tonic", "trace", "with-serde"] }

# ---- runtime / server ----
tokio        = { version = "1.54", features = ["full"] }
tokio-util   = { version = "0.7.20", features = ["rt"] }
futures      = "0.3"
bytes        = "1.12"
async-trait  = "0.1.92"
axum         = { version = "0.8.9", features = ["macros"] }
tower        = { version = "0.5.3", features = ["limit", "timeout", "util"] }
tower-http   = { version = "0.6.11", features = ["decompression-gzip", "decompression-zstd", "limit", "trace", "compression-gzip"] }
http         = "1.5"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
thiserror    = "2"

# ---- model ----
chrono = "0.4.45"
ulid   = "1.2"
hex    = "0.4.3"

# ---- config / cli ----
figment         = { version = "0.10.19", features = ["toml", "env"] }
bytesize        = { version = "2.7", features = ["serde"] }
humantime-serde = "1.1.1"
clap            = { version = "4.6.7", features = ["derive", "env"] }

# ---- storage / index ----
moka    = { version = "0.12.16", features = ["future"] }
roaring = "0.11"            # same crate as vortex's Selection::IncludeRoaring (lock: 0.11.5)

# ---- observability ----
metrics                     = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
tracing                     = "0.1.44"
tracing-subscriber          = { version = "0.3.23", features = ["env-filter", "json"] }

# ---- metastore ----
rusqlite = { version = "0.40.2", features = ["bundled"] }

# ---- clients / test / bench ----
reqwest   = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
proptest  = "1.12"
criterion = { version = "0.8.2", features = ["async_tokio"] }
tempfile  = "3.27"
crc32fast = "1.5"
sha2      = "0.11"
flate2    = "1"
zstd      = "0.13"

[workspace.lints.rust]
unsafe_code      = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs  = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
unknown_lints    = "deny"

[workspace.lints.clippy]
dbg_macro                = "warn"
todo                     = "warn"
print_stdout             = "warn"
print_stderr             = "warn"
implicit_clone           = "warn"
large_futures            = "warn"
needless_pass_by_ref_mut = "warn"
too_many_arguments       = "allow"
type_complexity          = "allow"
large_enum_variant       = "allow"
result_large_err         = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
debug = "line-tables-only"

[profile.quick-release]
inherits = "release"
codegen-units = 16
incremental = true
