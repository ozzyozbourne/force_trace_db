[package]
name = "forge-query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test hooks and wrappers (`testing`, the blocking-phase hook) for this crate's and forge-server's tests.
test-util = ["dep:forge-ingest", "forge-ingest/test-util", "forge-storage/test-util"]

[lints]
workspace = true

[dependencies]
forge-model.workspace = true
forge-meta.workspace = true
forge-storage.workspace = true
forge-index.workspace = true
datafusion.workspace = true
arrow.workspace = true
vortex.workspace = true
futures.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
crc32fast.workspace = true
bytes.workspace = true
object_store.workspace = true
roaring.workspace = true
moka.workspace = true
forge-ingest = { workspace = true, optional = true }

[dev-dependencies]
forge-query = { workspace = true, features = ["test-util"] }
forge-model = { workspace = true, features = ["test-util"] }
arrow = { workspace = true, features = ["prettyprint"] }
tempfile.workspace = true
proptest.workspace = true
bytesize.workspace = true
rusqlite.workspace = true
object_store.workspace = true
