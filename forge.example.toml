[storage]
url = "file:///var/lib/forge/data"   # or s3://bucket/prefix

[metastore]
url = "sqlite:///var/lib/forge/meta.db"   # or postgres://…

[wal]
mode = "local"   # local | object_store
dir = "/var/lib/forge/wal"
segment_bytes = "64MiB"
group_commit_max_bytes = "1MiB"
group_commit_max_delay = "10ms"

[memtable]
flush_bytes = "64MiB"
flush_interval = "30s"
memory_budget = "1GiB"

[cache]
memory = "512MiB"
disk = "10GiB"
disk_dir = "/var/lib/forge/cache"

[compaction]
target_segment = "256MiB"
concurrency = 2           # jobs at once; each needs up to ~0.9 GiB (3 x slice_bytes + open writers)
interval = "10s"          # picker tick; "0s" = no background compaction
l0_trigger = 4            # compact once this many L0 segments exist ...
l0_max_age = "10m"        # ... or the oldest is this old
max_job_bytes = "512MiB"  # input bytes per job (lower it on small hosts)
slice_bytes = "128MiB"    # decoded bytes merged at once
gc_interval = "10m"       # retention + purge + orphan sweep; "0s" = none (forge gc still works)
gc_grace = "1h"           # deleted segments' objects are kept this long
orphan_grace = "24h"      # unreferenced objects are kept this long

[query]
memory_limit = "2GiB"
timeout = "30s"
sql_concurrency = 0          # concurrent /v1/sql queries; 0 = max(2, cpus / 2)
max_response_bytes = "64MiB" # /v1/sql body cap (truncated: true past it)

[ingest]
default_project = "default"
blob_threshold = "1MiB"
max_request_bytes = "64MiB"
